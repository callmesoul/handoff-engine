openapi: 3.0.3
info:
  title: Orders API（示例契约，可被 doc/task-draft.example.json 直接引用）
  version: 1.0.0
servers:
  - url: https://dev-api.example.com
paths:
  /api/orders:
    get:
      operationId: listOrders
      summary: 订单列表（分页）
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 订单分页结果
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
  /api/orders/{id}:
    get:
      operationId: getOrder
      summary: 订单详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: 不存在
components:
  schemas:
    Order:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: string
        status:
          type: string
          description: 本次交接新增。取值 OPEN | PAID | CANCELLED，不得返回 null。
          enum: [OPEN, PAID, CANCELLED]
        amount:
          type: integer
          description: 单位分
        created_at:
          type: string
          format: date-time
